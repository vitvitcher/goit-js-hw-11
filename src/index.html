<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanilla App Template</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>


  <main>
    <form class="form">
      <label>
        <input type="text" name="search-text" placeholder="Search images..." required>
      </label>
      <button type="submit">Search</button>
      <button type="button" class="page-scroll-button-prev">Previous page</button>
      <button type="button" class="page-scroll-button-next">Next page</button>
      <p class="page-number"></p>
    </form>
    <ul class="gallery"></ul>
    <span class="loader"></span>
  </main>



  <script type="module" src="./main.js"></script>
</body>

</html>
